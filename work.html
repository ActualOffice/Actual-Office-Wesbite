  <style>
    :root {
      --bg: #ffffff;
      --text: #050505;
      --sans: "Helvetica Neue", Arial, sans-serif;
      --copy-size: clamp(1.1rem, 0.925vw, 1.65rem);
      --page-pad: 32px;
      --panel-max-width: 620px;
      --panel-ratio: 0.75;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
      cursor: none;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: none;
      background: none;
      border: 0;
      padding: 0;
    }

    figure {
      margin: 0;
    }

    .cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #000000;
      pointer-events: none;
      z-index: 50;
      transform: translate(-50%, -50%);
    }

    .nav-square {
      position: fixed;
      top: 18px;
      font-size: 2rem;
      line-height: 1;
      font-weight: 700;
      z-index: 10;
    }

    .nav-square.left {
      left: 28px;
    }

    .nav-square.right {
      right: 28px;
    }

    .site-nav {
      position: fixed;
      top: 58px;
      left: 28px;
      z-index: 11;
      background: #fff;
      padding: 4px 8px;
      margin-left: -8px;
      font-size: var(--copy-size);
      font-weight: 400;
    }

    .site-nav.right {
      right: 28px;
      left: auto;
      margin-left: 0;
      margin-right: -8px;
      text-align: right;
    }

    .site-nav a {
      display: block;
      padding: 5px 0;
    }

    @media (hover: none), (pointer: coarse) {
      body,
      a,
      button {
        cursor: auto;
      }

      .cursor-dot {
        display: none;
      }
    }

    .work-mobile {
      display: none;
    }

    .work-gallery {
      display: grid;
      row-gap: 4.5dvh;
      padding: 11dvh 14% 10dvh;
    }

    .work-set {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      min-height: 79dvh;
    }

    .work-set figure {
      display: grid;
      grid-row: 1;
      align-items: center;
      width: min(88%, 63.2dvh);
      height: 79dvh;
    }

    .work-set .image-a,
    .work-set .image-c {
      grid-column: 1;
      justify-self: start;
    }

    .work-set .image-b,
    .work-set .image-d {
      grid-column: 2;
      justify-self: end;
    }

    .work-set .image-c,
    .work-set .image-d {
      width: min(136%, 98dvh);
    }

    .work-set .image-e,
    .work-set .image-f {
      justify-self: center;
      width: min(52%, 41dvh);
      height: 42dvh;
    }

    .work-set .image-e { grid-column: 2; }
    .work-set .image-f { grid-column: 1; }

    .work-set img {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      object-position: center;
    }

    .work-set .image-a img,
    .work-set .image-c img { object-position: left center; }

    .work-set .image-b img,
    .work-set .image-d img { object-position: right center; }

    @media (max-width: 640px) {
      .nav-square {
        top: 16px;
        font-size: 1.6rem;
      }

      .nav-square.left {
        left: 16px;
      }

      .nav-square.right {
        right: 16px;
      }

      .site-nav {
        background: transparent;
        top: 48px;
        left: 16px;
      }

      .site-nav.right {
        right: 16px;
      }

      .work-gallery {
        display: none;
      }

      .work-mobile {
        display: grid;
        row-gap: 48px;
        padding: 105px 9% 72px;
      }

      .work-pack {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 100%;
        gap: 12px;
        min-width: 0;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scroll-snap-type: x mandatory;
      }

      .work-pack figure {
        aspect-ratio: 4 / 5;
        scroll-snap-align: start;
      }

      .work-pack img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    }
  </style>
</head>

  <script>
    const cursorDot = document.getElementById('cursorDot');
    const navButtons = document.querySelectorAll('button.nav-square');
    const siteNav = document.getElementById('siteNav');
    const navLinks = siteNav.querySelectorAll('a');
    let activeNavButton;

    function closeNav(restoreFocus = false) {
      if (!activeNavButton) return;
      activeNavButton.setAttribute('aria-expanded', 'false');
      siteNav.hidden = true;
      if (restoreFocus) activeNavButton.focus();
      activeNavButton = undefined;
    }

    document.addEventListener('mousemove', (event) => {
      if (!cursorDot) return;
      cursorDot.style.left = `${event.clientX}px`;
      cursorDot.style.top = `${event.clientY}px`;
    });

    navButtons.forEach((button) => {
      button.addEventListener('click', () => {
        if (activeNavButton === button) {
          closeNav(true);
          return;
        }

        closeNav();
        activeNavButton = button;
        button.setAttribute('aria-expanded', 'true');
        siteNav.hidden = false;
        navLinks[0].focus();
      });
    });

    siteNav.addEventListener('click', (event) => {
      if (event.target.closest('a')) closeNav(true);
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.nav-square, .site-nav')) closeNav();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && activeNavButton) {
        closeNav(true);
      }
    });

    window.addEventListener('pagehide', () => closeNav());
  </script>
